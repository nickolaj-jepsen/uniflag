name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: just,elf2uf2-rs
      - run: just img
      - name: Rename UF2 with tag
        run: cp target/uniflag.uf2 uniflag-${{ github.ref_name }}.uf2
      - uses: softprops/action-gh-release@v2
        with:
          files: uniflag-${{ github.ref_name }}.uf2
          generate_release_notes: true
          fail_on_unmatched_files: true
