[package]
name = "uniflag-sim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Host-side simulator that pretends to be SimHub for the uniflag firmware."

[[bin]]
name = "uniflag-sim"
path = "src/main.rs"

[dependencies]
proto      = { path = "../proto" }
clap       = { version = "4.5", features = ["derive"] }
crossterm  = "0.28"
serialport = "4.6"
anyhow     = "1.0"

[lints]
workspace = true
